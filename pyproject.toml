[project]
name = "ratio"
version = "0.1.0"
description = "Citation-grounded knowledge base of existing judgments, with executable encoding of legal judgement"
readme = "README.md"
requires-python = ">=3.11"

# Deliberately light. The Bayesian layer, BM25 and the citation parser are implemented
# in-tree (numpy + stdlib) rather than pulled from heavy dependencies, so the whole
# system installs and runs offline. See docs/01-architecture.md, "Dependency posture".
dependencies = [
    "pydantic>=2.9",
    "networkx>=3.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The agent layer talks to a model over an HTTP API. Not required for the
# deterministic core (KB, retrieval, rules, BN, eval), which runs fully offline.
llm = ["httpx>=0.27"]
mcp = ["mcp>=1.2"]
otel = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]
api = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
ratio = "ratio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]
